[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hugmunn"
dynamic = ["version"]
description = "Desktop application and Python API for local and cloud language models"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
authors = [{ name = "Einar Olafsson" }]
keywords = ["llm", "llama.cpp", "qt", "pyside6", "local-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "PySide6-Essentials>=6.6",
    "httpx>=0.27",
    "markdown>=3.5",
    "Pygments>=2.17",
]

[project.urls]
Homepage = "https://github.com/EinarOlafsson/hugmunn"
Documentation = "https://github.com/EinarOlafsson/hugmunn/tree/main/docs"
Repository = "https://github.com/EinarOlafsson/hugmunn"
Issues = "https://github.com/EinarOlafsson/hugmunn/issues"
Changelog = "https://github.com/EinarOlafsson/hugmunn/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# pytest-timeout: a GUI test that opens an unexpected modal hangs forever
# otherwise, and a suite that hangs gets killed rather than read.
# Qt fixtures live in tests/conftest.py; no pytest-qt plugin is required.
dev = ["pytest>=7.4", "pytest-timeout>=2.3"]
# Encrypted API-key storage. Without it keys go to a mode-600 file and the
# sign-in dialog says so, so this is a real upgrade rather than a requirement.
keyring = ["keyring>=24.0"]
docs = ["sphinx>=7.4", "myst-parser>=3.0"]
build = ["build>=1.2", "twine>=6", "pyinstaller>=6.11", "Pillow>=10"]

[project.scripts]
hugmunn = "hugmunn.app:main"

[project.gui-scripts]
hugmunn-gui = "hugmunn.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hugmunn*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "hugmunn._version.__version__"}

[tool.setuptools.package-data]
hugmunn = ["skills/*.md", "resources/icons/*.svg", "resources/icons/*.png", "resources/icons/*.ico", "resources/icons/*.icns", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Use the repository's Qt fixtures and avoid auto-loading a second Qt binding.
addopts = "-p no:pytest-qt"
