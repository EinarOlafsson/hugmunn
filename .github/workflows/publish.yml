name: Release Hugmunn

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hugmunn-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: release
        name: Check whether this version needs a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/release.py plan

  validate:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    uses: ./.github/workflows/ci.yml

  desktop:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    uses: ./.github/workflows/desktop.yml

  tag:
    needs: [prepare, validate, desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reserve the tested version tag without changing commit authors
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            test "$(git rev-parse "${tag}^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          fi

  publish:
    needs: [prepare, tag]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/hugmunn
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-and-docs
          path: validated/
      - name: Publish through the owner's PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: validated/dist/
          skip-existing: true

  release:
    needs: [prepare, tag]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: hugmunn-*
          merge-multiple: true
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: python-package-and-docs
          path: validated/
      - name: Prepare package assets and release notes
        run: |
          cp validated/dist/*.whl validated/dist/*.tar.gz release/
          python packaging/release.py notes --output release-notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --verify-tag \
              --title "Hugmunn ${RELEASE_VERSION}" --notes-file release-notes.md
          fi
