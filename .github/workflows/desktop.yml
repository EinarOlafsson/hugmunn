name: Desktop installers

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - run: python -m pip install ".[build]"
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python -c "import os, hugmunn; assert os.environ['GITHUB_REF_NAME'] == 'v' + hugmunn.__version__"
      - name: Build and smoke-test the native application
        run: python packaging/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: hugmunn-${{ runner.os }}-${{ runner.arch }}
          path: dist/desktop/*
          if-no-files-found: error
