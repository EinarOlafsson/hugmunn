name: Tests and Python package

on:
  workflow_call:
  push:
    branches: [main, nightly]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -p pytest_timeout --timeout=45

  package:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel, not the source tree
        run: python -m pip install dist/*.whl
      - name: Check installed resources and entry points
        working-directory: /tmp
        run: |
          python -c "import hugmunn; from hugmunn.branding import svg; assert len(hugmunn.skills()) >= 27; assert '<svg' in svg(); assert '<svg' in svg('horizontal', light=True)"
          hugmunn --version
          python -m hugmunn --help
          HUGMUNN_CONFIG_DIR="$RUNNER_TEMP/hugmunn-smoke" HUGMUNN_MODELS_ROOT="$RUNNER_TEMP/models" hugmunn --smoke-test
      - run: python -m pip install ".[docs]"
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-and-docs
          path: |
            dist/*.whl
            dist/*.tar.gz
            docs/_build/html/
